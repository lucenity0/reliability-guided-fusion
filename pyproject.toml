[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmf"
version = "0.0.1"
description = "Reliability-guided dynamic expert fusion for multimodal classification"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
  "torch>=2.1",
  "transformers>=4.45",
  "pillow>=10.0",
  "h5py>=3.10",
  "optuna>=4.0",
  "tqdm",
]
lmm = [
  "accelerate>=0.33",
  "bitsandbytes>=0.43",
]
report = [
  "matplotlib>=3.8",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["hmf*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
