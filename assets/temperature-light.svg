<text x="260" y="78" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#161513" opacity="0">τ → ∞    static fusion<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.28;0.4;0.62;0.74;0.92;1" dur="12s" repeatCount="indefinite"/></text><text x="260" y="78" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#161513" opacity="0">τ = 1    soft mixture<animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;0.28;0.4;0.62;0.74;0.92;1" dur="12s" repeatCount="indefinite"/></text><text x="260" y="78" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#161513" opacity="0">τ → 0    hard selection<animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.28;0.4;0.62;0.74;0.92;1" dur="12s" repeatCount="indefinite"/></text>
<rect x="260" y="96" width="0" height="30" fill="#161513" stroke="#161513" stroke-width="1"><animate attributeName="x" values="260;260;260;260;260;260;260" keyTimes="0;0.28;0.4;0.62;0.74;0.92;1" dur="12s" repeatCount="indefinite"/><animate attributeName="width" values="253.3;253.3;380.0;380.0;760.0;760.0;253.3" keyTimes="0;0.28;0.4;0.62;0.74;0.92;1" dur="12s" repeatCount="indefinite"/></rect><rect x="260" y="96" width="0" height="30" fill="url(#hatch)" stroke="#161513" stroke-width="1"><animate attributeName="x" values="513.3;513.3;640.0;640.0;1020.0;1020.0;513.3" keyTimes="0;0.28;0.4;0.62;0.74;0.92;1" dur="12s" repeatCount="indefinite"/><animate attributeName="width" values="253.3;253.3;228.0;228.0;0.0;0.0;253.3" keyTimes="0;0.28;0.4;0.62;0.74;0.92;1" dur="12s" repeatCount="indefinite"/></rect><rect x="260" y="96" width="0" height="30" fill="url(#dots)" stroke="#161513" stroke-width="1"><animate attributeName="x" values="766.7;766.7;868.0;868.0;1020.0;1020.0;766.7" keyTimes="0;0.28;0.4;0.62;0.74;0.92;1" dur="12s" repeatCount="indefinite"/><animate attributeName="width" values="253.3;253.3;152.0;152.0;0.0;0.0;253.3" keyTimes="0;0.28;0.4;0.62;0.74;0.92;1" dur="12s" repeatCount="indefinite"/></rect>
