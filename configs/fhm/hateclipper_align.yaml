# FHM Hate-CLIPper, align fusion: 1 mapping layer, 3 pre-output layers (gate #13, D-013).
# Published settings, Hate-CLIPper paper Table 3 (gokulkarthik/hateclipper@86ad7f1,
# images/hateclipper-paper.pdf p. 6): n = m = 1024, AdamW, lr 1e-4, weight decay 1e-4,
# batch 64, 20 epochs, gradient clip 0.1. Dropouts from the official run.sh (0.2 0.4 0.1:
# map, fusion, pre-output). No lr scheduler in engine.py configure_optimizers, so the lr
# is constant. patience 20 never cuts the 20 epochs short; selection stays val AUROC.
# Paths are runtime keys: set HMF_FEATURE_DIR, HMF_RESULTS_DIR and CHECKPOINT_DIR.

# Shared runtime defaults (configs/default.yaml)
seed: 0
deterministic: true
data_dir: data
feature_dir: features
results_dir: results
checkpoint_dir: checkpoints
num_workers: 0
clip_model: openai/clip-vit-large-patch14

# Data: pre-projection pooler outputs at 224 px (#11 hc224 cache)
dataset: fhm
method: hateclipper_align
model: hateclipper
cache_version: hc224
num_classes: 2
max_samples: 0

# Model (hmf/models/hateclipper.py)
image_dim: 1024
text_dim: 768
map_dim: 1024
num_mapping_layers: 1
fusion: align
num_pre_output_layers: 3
pre_output_dim: 1024
drop_map: 0.2
drop_fusion: 0.4
drop_pre_output: 0.1

# Training
lr: 1.0e-4
weight_decay: 1.0e-4
lr_schedule: constant
warmup_frac: 0.0
grad_clip: 0.1
batch_size: 64
num_epochs: 20
patience: 20
