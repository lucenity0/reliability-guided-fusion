deterministic: true
data_dir: data
feature_dir: features
results_dir: results
checkpoint_dir: checkpoints
num_workers: 0
clip_model: openai/clip-vit-large-patch14-336
dataset: food101
method: qmf
model: qmf
cache_version: v1
